profiles:
  arduino_agent:
    fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs
    platforms:
    - platform: esp32:esp32 (3.3.11)
      platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
    - Adafruit GFX Library (1.12.4)
    - Adafruit BusIO (1.17.4)
    - Adafruit SSD1306 (2.5.16)
    - Adafruit BME280 Library (2.3.0)
    - Adafruit Unified Sensor (1.1.15)
    - Adafruit_VL53L0X (1.2.5)
    - Adafruit VL53L1X (3.1.2)
    - SparkFun VL53L5CX Arduino Library (1.0.3)
    - PubSubClient (2.8)
    port_config:
      baudrate: 115200
    protocol: serial
